[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nids"
version = "1.0.0"
description = "Network intrusion detection on NSL-KDD: supervised deep classifier and autoencoder anomaly detector"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Seyedmohammad (Ehsan) Ghoreishi" }]
keywords = ["intrusion-detection", "cybersecurity", "anomaly-detection", "autoencoder", "nsl-kdd"]
dependencies = [
    "tensorflow>=2.16,<3",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nids = "nids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Raised inside Keras' TensorFlow backend under NumPy 2; not actionable here.
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E241"]
